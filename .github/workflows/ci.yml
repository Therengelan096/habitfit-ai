name: CI Pruebas Automáticas

on:
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  test:
    name: Build and Test Node.js
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
          POSTGRES_DB: habitfit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm ci

      - name: Ejecutar pruebas
        working-directory: ./backend
        env:
          DB_USER: postgres
          DB_PASSWORD: testpassword123
          DB_NAME: habitfit_test
          DB_HOST: localhost
          JWT_SECRET: secreto_falso_para_tests
          NODE_ENV: test
        run: npm test